
services:
  db:
    container_name: db
    image: postgres:16
    environment:
      POSTGRES_DB: recall
      POSTGRES_USER: ru0ya
      POSTGRES_PASSWORD: password
    volumes:
      - npgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - db
        #networks:
        #- djangonetwork

volumes:
  npgdata:

    #networks:
    #djangonetwork:
    #driver: bridge
